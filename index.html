<style>
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--navy,#1F3557);overflow:auto}
#gate .gbox{background:var(--bg,#fff);color:var(--ink,#1a2433);border-radius:10px;max-width:560px;width:100%;padding:28px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25);border-top:5px solid var(--sage,#7F9C7A)}
#gate h1{font-family:"Source Serif 4",Georgia,serif;font-size:1.45rem;margin:0 0 8px;color:var(--navy,#1F3557)}
#gate h2{font-size:1rem;margin:18px 0 6px}
#gate p{margin:6px 0 12px;line-height:1.45}
#gate .gsm{font-size:.85rem;opacity:.8}
#gate label{display:block;font-size:.85rem;margin:10px 0 0}
#gate input,#gate textarea,#gate select{width:100%;box-sizing:border-box;margin-top:4px;padding:9px 10px;border:1px solid #c9d1db;border-radius:6px;font:inherit;background:#fff;color:#1a2433}
#gate textarea{font-family:"IBM Plex Mono",monospace;font-size:.8rem}
#gate select{width:auto}
#gate table{width:100%;border-collapse:collapse;font-size:.88rem}#gate td{padding:6px 4px;border-bottom:1px solid #e4e8ee;vertical-align:middle}
#gate .grow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.gb{padding:9px 14px;border-radius:6px;border:1px solid #c9d1db;background:#fff;color:#1F3557;font:inherit;font-weight:500;cursor:pointer}
.gb.pri{background:#1F3557;color:#fff;border-color:#1F3557}
#gate a{color:#4f6f4a}
#g-bar{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.gl{all:unset;cursor:pointer;font-size:.8rem;font-weight:500;padding:6px 9px;border-radius:6px;color:var(--side-ink,#fff);border:1px solid color-mix(in srgb,var(--side-ink,#fff) 35%,transparent);display:flex;gap:6px;align-items:center}
.gl:hover{background:color-mix(in srgb,var(--side-ink,#fff) 14%,transparent)}
.gl .gi{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:.7rem;font-weight:700;background:var(--side-on,#7F9C7A);color:var(--side-on-ink,#0F1A12)}
.gl.warn{border-color:var(--side-on,#7F9C7A);background:color-mix(in srgb,var(--side-on,#7F9C7A) 22%,transparent)}
.gl.warn .gi{background:#F2C879;color:#1a1300}
#gate .gchk{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;border:1px solid #d6dfe6;border-radius:6px;padding:6px 8px;margin:4px 0}
#gate .gchk label{display:flex;gap:6px;align-items:center;margin:0;font-size:.85rem}#gate .gchk input{width:auto;margin:0}
#gate details{margin-top:4px}#gate summary{cursor:pointer}
#portal{min-height:100vh;background:var(--bg)}
.p-top{background:var(--side,#1F3557);color:var(--side-ink,#fff);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(16px,3vw)}
.p-top small{display:block;opacity:.8;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}.p-top b{font-family:var(--display);font-size:1.2rem}
.p-who{text-align:right;font-size:.82rem}.p-who .gl{display:inline-flex;margin-top:4px}
.p-main{max-width:1100px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.p-main .gsm{font-size:.85rem;color:var(--muted)}
.p-main h1{font-size:1.5rem}
.p-sel{display:flex;gap:8px;align-items:center;font-size:.9rem}.p-sel select{width:auto}
.p-av{display:flex;flex-direction:column;gap:6px;margin-top:6px}.p-bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}.p-bar i{display:block;height:100%;background:var(--sage)}
.p-msg{background:var(--sage-soft);border-radius:6px;padding:10px 12px;white-space:pre-wrap}
.p-obs{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}.p-obs p{margin:0}.p-obs label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.p-main .grow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-main a.gb{text-decoration:none;display:inline-block}
.p-html{overflow-x:auto;font-size:.9rem}.p-html table{border-collapse:collapse;width:100%}.p-html td,.p-html th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}.p-html .n{text-align:right}
@media print{.p-top,.p-sel,.gb{display:none}}
.gtoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;background:#1F3557;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gtoast.bad{background:#8c2f2f}
</style>
<style>
/* Layout: barra lateral de fases del encargo + área de trabajo con cédulas tabulares densas */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --sunk:#E9EFEC; --fg:#18233A; --muted:#5B6878; --line:#D6DFDA;
  --navy:#1F3557; --navy-ink:#FFFFFF; --sage:#7F9C7A; --sage-soft:#E3ECE1; --sage-ink:#0F1A12; --side:#1F3557; --side-ink:#FFFFFF; --side-on:#7F9C7A; --side-on-ink:#0F1A12;
  --ok:#2F7A55; --ok-soft:#DFF0E6; --warn:#A86A12; --warn-soft:#FBEFD9; --bad:#B23A3A; --bad-soft:#F8E1E1;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151E; --surface:#15202C; --sunk:#1B2836; --fg:#E4EAF0; --muted:#94A2B1; --line:#283747;
  --navy:#9DB8DD; --navy-ink:#0E151E; --sage:#A5C19F; --sage-soft:#22332A; --sage-ink:#0E151E; --side:#0E1A29; --side-ink:#E4EAF0; --side-on:#A5C19F; --side-on-ink:#0E151E;
  --ok:#6CC596; --ok-soft:#173326; --warn:#E3AE5C; --warn-soft:#3A2C14; --bad:#EE8B8B; --bad-soft:#3A1C1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151E; --surface:#15202C; --sunk:#1B2836; --fg:#E4EAF0; --muted:#94A2B1; --line:#283747;
  --navy:#9DB8DD; --navy-ink:#0E151E; --sage:#A5C19F; --sage-soft:#22332A; --sage-ink:#0E151E; --side:#0E1A29; --side-ink:#E4EAF0; --side-on:#A5C19F; --side-on-ink:#0E151E;
  --ok:#6CC596; --ok-soft:#173326; --warn:#E3AE5C; --warn-soft:#3A2C14; --bad:#EE8B8B; --bad-soft:#3A1C1F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1rem;font-family:var(--body);font-weight:600}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--side);color:var(--side-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
:root[data-theme="dark"] aside{}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--side-ink) 25%,transparent)}
.brand b{font-family:var(--display);font-size:1.05rem}
.brand small{opacity:.75;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:5px;font-size:.88rem}
nav button .n{font-family:var(--mono);font-size:.72rem;opacity:.7;width:18px}
nav button:hover{background:color-mix(in srgb,var(--side-ink) 14%,transparent)}
nav button.on{background:var(--side-on);color:var(--side-on-ink);font-weight:600}
nav button:focus-visible{outline:2px solid var(--sage)}
nav .sep{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:10px 9px 2px}
.who{margin-top:auto;font-size:.8rem}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,2vw);padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.topbar .meta{color:var(--muted);font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.navy{background:var(--navy);color:var(--navy-ink)} .pill.sage{background:var(--sage-soft);color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.panel .hint{color:var(--muted);font-size:.84rem;max-width:80ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
label.f.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;color:var(--fg);min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sage);outline-offset:1px}
input[type=checkbox]{accent-color:var(--navy);width:16px;height:16px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.sage{background:var(--sage);color:var(--sage-ink);border-color:var(--sage)}
.btn.ghost{border-color:transparent;background:none;color:var(--navy)}
.norm{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}.norm span{font-weight:600;color:var(--fg)}
.fundl{display:flex;gap:4px;align-items:center;margin-top:4px}.fundl input{font-size:.78rem;padding:3px 6px;color:var(--muted)}
#nav-back{margin-right:4px}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:3px 8px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:.86rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--navy);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--sage)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th{background:var(--sunk);text-align:left;font-weight:600;font-size:.74rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.c{text-align:center}
td.code{font-family:var(--mono);white-space:nowrap}
tr.tot td{font-weight:600;background:var(--sunk);border-top:2px solid var(--fg)}
tr.sub td{font-weight:600;background:color-mix(in srgb,var(--sage-soft) 60%,var(--surface))}
tr.flag td{background:var(--warn-soft)}
tr.sel td{background:color-mix(in srgb,var(--sage-soft) 70%,var(--surface))}
td input,td select{padding:3px 5px;font-size:.8rem}
.neg{color:var(--bad)}
.marks{display:inline-flex;gap:2px;flex-wrap:wrap;min-width:34px;min-height:20px;cursor:pointer;padding:1px 4px;border:1px dashed var(--line);border-radius:4px;color:var(--bad);font-weight:600}
.marks:hover{border-color:var(--navy)}
.marks.ro{cursor:default;border-color:transparent}
.ref{font-family:var(--mono);font-size:.76rem;color:var(--navy);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.tile small{color:var(--muted);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
.tile b{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.78rem}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;background:var(--surface)}
.chip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip:focus-visible{outline:2px solid var(--sage)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.navy{background:var(--sage)}
.note{border-left:3px solid var(--sage);padding:8px 12px;background:var(--sage-soft);border-radius:0 5px 5px 0;font-size:.85rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:8px;border:1px solid var(--line);width:min(900px,100%);display:flex;flex-direction:column;gap:12px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal>header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;z-index:60;font-size:.86rem;max-width:min(420px,90vw)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.right{margin-left:auto}
.kbd{font-family:var(--mono);background:var(--sunk);padding:0 5px;border-radius:3px;font-size:.78rem}
.signs{display:flex;gap:10px;flex-wrap:wrap}
.sign{border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:.8rem;display:flex;flex-direction:column;gap:2px;min-width:170px}
.sign small{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.68rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ecard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.ecard h3{font-family:var(--display);font-size:1.05rem}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-105%);transition:transform .2s;height:100%;padding-top:max(18px,env(safe-area-inset-top,0px))}
  aside.open{transform:none}
  .menu-btn{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function ciCatalog(){const fc=S.settings&&S.settings.ciCat;const out={};CI_CYC.forEach(c=>{out[c.k]=(fc&&fc[c.k])?fc[c.k]:(CI_BASE[c.k]||[]).map((q,i)=>({id:c.k+String(i+1).padStart(2,'0'),txt:q[0],clave:!!q[1],asev:q[2]}))});return out}

 const ct=live(d.ctrls);const tested=ct.filter(([,x])=>x.efi&&x.efi!=='np');const ef=ct.filter(([,x])=>x.efi==='si');const fail=ct.filter(([,x])=>x.efi==='no'||x.dis==='no'||x.imp==='no');
 const defs=live(d.defs);let sug='M';if(noK.length||fail.length)sug='A';else if(ct.length&&ef.length===ct.length)sug='B';
 return {qs,ans,noK,noA,ct,tested,ef,fail,defs,sug,concl:d.concl&&d.concl.rc?d.concl:null}}
function ciRCFor(k){const spec=CI_CYC.filter(c=>c.rub!=='*'&&c.rub.includes(k));const perv=CI_CYC.filter(c=>c.rub==='*');const specC=spec.filter(c=>ciStats(c.k).concl);
 if(spec.length&&!specC.length)return null;const rel=specC.concat(perv.filter(c=>ciStats(c.k).concl));if(!rel.length)return null;
 return rel.map(c=>ciStats(c.k).concl.rc).sort((a,b)=>LVL[b]-LVL[a])[0]}

 ${big.length?`<div class="note warn">${big.length} estimaciones con diferencia igual o mayor al AMPT (${money(M.am)}).</div>`:''}${bias.length?`<div class="note bad">Hay ${bias.length} estimaciones con indicios de sesgo de la administración: evalúalos en conjunto (NIA 540) y considéralos en el riesgo de fraude.</div>`:''}

let NAVH=[],NAVBUSY=false,NAVHIST=true;
function navSnap(){const t={};for(const k in S)if(/(Tab|Cyc|Base)$/.test(k)&&(typeof S[k]==='string'||S[k]==null))t[k]=S[k];return {view:S.view,eid:S.eid,rubro:S.rubro,acc:S.acc,t,y:window.scrollY||0}}
const navSame=(a,b)=>a.view===b.view&&a.eid===b.eid&&a.rubro===b.rubro&&a.acc===b.acc&&JSON.stringify(a.t)===JSON.stringify(b.t);
function navPush(prev){if(NAVBUSY||!prev)return;const cur=navSnap();if(navSame(prev,cur))return;NAVH.push(prev);if(NAVH.length>80)NAVH.shift();if(NAVHIST){try{history.pushState({aud:NAVH.length},'')}catch(e){NAVHIST=false}}const b=$('#nav-back');if(b)b.disabled=false}
function navBack(){const p=NAVH.pop();if(!p)return;NAVBUSY=true;try{Object.keys(p.t).forEach(k=>S[k]=p.t[k]);S.rubro=p.rubro;S.acc=p.acc;
 if(p.eid&&p.eid!==S.eid){openEng(p.eid,p.view)}else if(!p.eid&&S.eid&&p.view==='home'){closeEng()}else{S.view=p.view;ls('aud.view',p.view);renderNav();render()}
 setTimeout(()=>window.scrollTo(0,p.y||0),40)}finally{NAVBUSY=false}}
ACT.back=()=>{if(NAVHIST&&history.state&&history.state.aud)history.back();else navBack()};

const TEMA_DEF={modo:'auto',pri:'#1F3557',acc:'#7F9C7A',side:'',letra:'normal'};
const hex2rgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return isNaN(n)||h.length!==6?null:[n>>16&255,n>>8&255,n&255]};
const rgb2hex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixC=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);if(!x||!y)return a;return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t))};
function lum(h){const c=hex2rgb(h);if(!c)return 0;const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])}
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const inkFor=bg=>contrast(bg,'#FFFFFF')>=contrast(bg,'#10161F')?'#FFFFFF':'#10161F';
function readable(fg,bg,min){let c=fg;const dark=lum(bg)<.4;for(let i=0;i<20&&contrast(c,bg)<min;i++)c=mixC(c,dark?'#FFFFFF':'#000000',.12);return c}
function temaCur(){const firm=(S.settings&&S.settings.tema)||{};let mine={};try{mine=JSON.parse(ls('aud.tema')||'{}')||{}}catch(e){}return {...TEMA_DEF,...firm,...mine,_firm:firm,_mine:mine}}
function isDark(modo){return modo==='oscuro'||(modo==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTema(){const t=temaCur();const R=document.documentElement;const dark=isDark(t.modo);R.dataset.theme=dark?'dark':'light';
 const bg=dark?'#0E151E':'#F3F6F4',surf=dark?'#15202C':'#FFFFFF';
 const pri=dark?readable(mixC(t.pri,'#FFFFFF',.55),surf,4.5):readable(t.pri,surf,4.5);
 const acc=dark?mixC(t.acc,'#FFFFFF',.2):t.acc;
 const side=t.side||t.pri;const sideBg=dark?mixC(side,'#000000',.55):side;
 const v={'--navy':pri,'--navy-ink':inkFor(pri),'--sage':acc,'--sage-ink':inkFor(acc),'--sage-soft':dark?mixC(acc,'#000000',.7):mixC(acc,'#FFFFFF',.78),'--side':sideBg,'--side-ink':inkFor(sideBg),'--side-on':acc,'--side-on-ink':inkFor(acc)};
 Object.entries(v).forEach(([k,x])=>R.style.setProperty(k,x));R.style.fontSize=t.letra==='grande'?'16px':t.letra==='muygrande'?'17.5px':'';return t}
addEventListener('load',()=>{try{applyTema();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTema)}catch(e){}});
function temaPanel(){const t=temaCur();const f=t._firm||{};const sw=(id,l,v)=>`<label class="f">${l}<input type="color" id="${id}" value="${esc(v)}" style="height:36px;padding:2px"></label>`;
 const chk=[['Texto de botones principales',contrast(inkFor(t.pri),t.pri)],['Menú lateral',contrast(inkFor(t.side||t.pri),t.side||t.pri)],['Opción seleccionada del menú',contrast(inkFor(t.acc),t.acc)],['Enlaces y títulos sobre fondo claro',contrast(t.pri,'#FFFFFF')]];
 return `<section class="panel"><header><h2>Apariencia</h2><span class="hint">Cambia solo en tu pantalla. ${S.canEdit?'Como editor puedes guardarla también como la del despacho, para todos.':''}</span></header>
 <div class="form"><label class="f">Modo<select id="tm-modo">${[['auto','Automático (según Windows)'],['claro','Claro'],['oscuro','Oscuro']].map(([k,l])=>`<option value="${k}" ${t.modo===k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="f">Tamaño de letra<select id="tm-letra">${[['normal','Normal'],['grande','Grande'],['muygrande','Muy grande']].map(([k,l])=>`<option value="${k}" ${t.letra===k?'selected':''}>${l}</option>`).join('')}</select></label>
 ${sw('tm-pri','Color principal (botones, títulos)',t.pri)}${sw('tm-acc','Color de acento (selección)',t.acc)}${sw('tm-side','Fondo del menú lateral',t.side||t.pri)}</div>
 <div class="tw" style="max-width:620px"><table><thead><tr><th>Contraste</th><th class="n">Relación</th><th>Lectura</th></tr></thead><tbody>${chk.map(([l,r])=>`<tr><td>${l}</td><td class="n">${r.toFixed(1)} : 1</td><td>${r>=4.5?'<span class="pill ok">Buena</span>':r>=3?'<span class="pill warn">Justa</span>':'<span class="pill bad">Difícil de leer</span>'}</td></tr>`).join('')}</tbody></table></div>
 <div class="hint">El aplicativo ajusta solo el color de las letras sobre cada fondo (blanco u oscuro) para que siempre se lean. Se recomienda una relación de 4.5 : 1 o más.</div>
 <div class="row"><button class="btn pri sm" data-act="temaMine">Aplicar en mi pantalla</button><button class="btn sm" data-act="temaReset">Volver a los colores del despacho</button>${S.canEdit?'<button class="btn sm" data-act="temaFirm">Guardar como colores del despacho</button>':''}</div></section>`}

 <div class="row">${!mine&&S.uid?`<select id="rol-me" aria-label="Mi rol">${Object.entries(ROLES).filter(([k])=>canMng||k==='aux'||k==='enc').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn sm pri" data-act="rolMe" data-w>Agregarme al equipo</button>`:''}

function closeBlockers(){const C=calc();const out=[];const rubs=RUB.filter(r=>C.rub[r.k].accs.length);
 const na=rubs.filter(r=>(S.wp[r.k]||{}).status!=='autorizado');if(na.length)out.push(`${na.length} cédulas sin firma de autorización: ${na.slice(0,12).map(r=>r.k).join(', ')}${na.length>12?'…':''}`);
 const notes=rubs.reduce((s,r)=>s+wpProgress(r.k).open,0);if(notes)out.push(`${notes} notas de revisión abiertas`);
 if(C.npend||C.unm)out.push(`${C.npend} cuentas por confirmar y ${C.unm} sin sumaria`);
 const al=(S.imp||[]).filter(r=>!r.ack&&repAlert(r)).length;if(al)out.push(`${al} importaciones con alertas sin revisar`);
 const ip=indepPend();if(ip.length)out.push(`${ip.length} integrantes del equipo sin declaración de independencia`);if(!(S.eng.carta||{}).firmada)out.push('Carta convenio sin firma del cliente');if(eqrReq()&&!(S.eng.eqr||{}).firma)out.push('Revisión de control de calidad sin firma');const eqo=live((S.eng.eqr||{}).notas).filter(([,n])=>!n.closed).length;if(eqo)out.push(`${eqo} notas del revisor de calidad sin atender`);const prop=S.adj.filter(a=>a.estado==='propuesto'||!a.estado).length;if(prop)out.push(`${prop} ajustes en estado propuesto (defínelos como aceptados, registrados o no ajustados)`);return out}

 <div class="row"><button class="btn" data-act="backup">Descargar respaldo</button>${role==='soc'?'<button class="btn dng" data-act="reopen">Reabrir expediente</button>':'<span class="hint">Solo un socio del encargo puede reabrirlo.</span>'}<button class="btn sage" data-act="rollEng">Crear expediente del siguiente ejercicio</button></div></section>`;

 const sud=S.adj.filter(a=>a.estado==='no_ajustado'&&a.tipo!=='fiscal').reduce((s,a)=>s+adjEffect(a).res,0);const open=S.obs.filter(o=>o.estado!=='Atendida');

const normDigits=c=>String(c).replace(/[^0-9A-Za-z]/g,'');

 let best=0;[lo-1,lo].forEach(j=>{if(j>=0&&j<mapped.length&&mapped[j].k!==k)best=Math.max(best,lcp(mapped[j].k,k))});
 if(best<Math.max(3,Math.ceil(k.length*.45)))return null;const cand=[];
 for(let j=lo-1;j>=0&&lcp(mapped[j].k,k)>=best;j--)cand.push(mapped[j]);for(let j=lo;j<mapped.length&&lcp(mapped[j].k,k)>=best;j++)if(mapped[j].k!==k)cand.push(mapped[j]);
 const rs=new Set(cand.map(x=>x.r));if(rs.size!==1)return null;return {r:[...rs][0],de:cand.slice(0,3).map(x=>x.c)}}
const hk=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
function jrKeys(rows){const seen={};return rows.map(r=>{const b=hk(r.join('|'));const n=seen[b]=(seen[b]||0)+1;return 'h'+b+(n>1?'-'+n:'')})}

function splitDelim(text){const lines=text.split(/\r?\n/);const sample=lines.slice(0,30).join('\n');const cands=['\t','|',';',','];let best=',',bc=-1;cands.forEach(d=>{const c=sample.split(d).length;if(c>bc){bc=c;best=d}});
 return lines.map(l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===best&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())})}
async function readAny(file){const ext=(file.name.split('.').pop()||'').toLowerCase();
 if(['xlsx','xls','xlsm','ods'].includes(ext)){if(!window.XLSX)throw new Error('No se cargó el lector de Excel. Revisa tu conexión y recarga.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}))}
 const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);if(text.includes('\uFFFD'))text=new TextDecoder('windows-1252').decode(buf);
 if(['html','htm','xml'].includes(ext)||/<table/i.test(text.slice(0,5000))){const doc=new DOMParser().parseFromString(text,'text/html');const ts=[...doc.querySelectorAll('table')];if(!ts.length)throw new Error('El HTML no contiene tablas.');return ts.map((t,i)=>({name:'Tabla '+(i+1),rows:[...t.rows].map(r=>[...r.cells].map(c=>c.textContent.replace(/\s+/g,' ').trim()))})).sort((a,b)=>b.rows.length-a.rows.length)}
 return [{name:file.name,rows:splitDelim(text).filter(r=>r.some(c=>c!==''))}]}
function num(v){if(typeof v==='number')return v;if(v==null)return 0;let s=String(v).trim();if(!s||s==='-')return 0;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}if(/-$/.test(s)){neg=true;s=s.slice(0,-1)}s=s.replace(/[$\s]|MXN/gi,'');
 if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);if(isNaN(n))return 0;return neg?-n:n}
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
function pdate(v){if(typeof v==='number'&&v>20000&&v<80000){return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10)}const s=String(v||'').trim();let m;
 if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
 if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
 if(m=s.match(/^(\d{1,2})[-\/. ]([A-Za-zé]{3})[A-Za-z]*[-\/. ](\d{2,4})/i)){const mm=MESES[m[2].toLowerCase().slice(0,3)];if(mm){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${String(mm).padStart(2,'0')}-${m[1].padStart(2,'0')}`}}return ''}
const FIELDS={tb:[['c','Cuenta',/(^|\b)(n[uú]m(ero)?\.?\s*(de\s*)?)?(cuenta|c[oó]digo|cta)\b|cuenta de mayor|account/i],['n','Nombre',/nombre|descrip|texto|denominaci/i],['si','Saldo inicial',/saldo\s*(inicial|anterior)|arrastre|^inicial$/i],['sid','Saldo inicial deudor',/inicial.*deud|deud.*inicial|anterior.*deud/i],['sia','Saldo inicial acreedor',/inicial.*acre|acre.*inicial|anterior.*acre/i],['ca','Cargos',/(^|[\s\-])(total\s*)?(cargos?|debe|d[eé]bitos?|debit)\s*$/i],['ab','Abonos',/(^|[\s\-])(total\s*)?(abonos?|haber|cr[eé]ditos?|credit)\s*$/i],['sf','Saldo final',/saldo\s*(final|actual|acumulado)|(^|[\s\-])saldo\s*$/i],['sfd','Saldo final deudor',/final.*deud|deud.*final|actual.*deud/i],['sfa','Saldo final acreedor',/final.*acre|acre.*final|actual.*acre/i]],

 box.querySelector('#mp-go').onclick=async()=>{const hh=Math.max(0,+box.querySelector('#mp-h').value-1);const mm={};F.forEach(f=>{const v=box.querySelector('#mp-'+f[0]).value;if(v!=='')mm[f[0]]=+v});

    msg.textContent='Guardando '+out.main.length+' cuentas…';const oldRows=rowsOf(tbOf(kind));await saveChunks(kind,out.main);const rp=kind==='ant'?null:await importReport(kind,fname,oldRows,out.main);if(kind==='act')await saveChunks('sn',sep?out.sn:[]);

function buildTB(data,m,sg,dd,leaf,skipZero,sepSN){const deud=new Set(dd.split(',').map(s=>s.trim()));const out=[],sn=[];
 const g=(r,k)=>m[k]!=null?r[m[k]]:undefined;
 data.forEach(r=>{let c=g(r,'c');if(c==null||c==='')return;c=String(c).trim();if(!/\d/.test(c)||/total/i.test(c))return;
  const n=String(g(r,'n')??'').trim();let si=m.sid!=null?num(g(r,'sid'))-num(g(r,'sia')):num(g(r,'si'));let sf=m.sfd!=null?num(g(r,'sfd'))-num(g(r,'sfa')):num(g(r,'sf'));const ca=num(g(r,'ca')),ab=num(g(r,'ab'));
  const isSN=sepSN&&/^[A-Za-z]{1,2}\d{3,}$/.test(c);
  if(sg==='n'&&m.sid==null&&m.sfd==null&&!isSN){const d=c.replace(/\D/g,'')[0];if(!deud.has(d)){si=-si;sf=-sf}}
  if(m.sf==null&&m.sfd==null)sf=si+ca-ab;if(m.si==null&&m.sid==null)si=sf-ca+ab;
  if(skipZero&&Math.abs(si)<0.005&&Math.abs(ca)<0.005&&Math.abs(ab)<0.005&&Math.abs(sf)<0.005)return;
  (isSN?sn:out).push([c,n,r2(si),r2(ca),r2(ab),r2(sf)])});
 let main=out;if(leaf&&out.length){const ks=out.map(r=>({...normCode(r[0]),raw:String(r[0]).replace(/[^0-9A-Za-z]/g,'')}));const isP=ks.map((k,i)=>ks.some((o,j)=>j!==i&&(k.seg?o.k.startsWith(k.k+'.'):o.raw.length>k.raw.length&&o.k.startsWith(k.k))));main=out.filter((r,i)=>!isP[i])}
 return {main,sn}}
function detectHeader(rows){let best=0,bs=-1;for(let i=0;i<Math.min(rows.length,40);i++){const s=rows[i].filter(c=>typeof c==='string'&&/cuenta|nombre|descrip|cargo|abono|debe|haber|saldo|fecha|p[oó]liza|concepto|c[oó]digo/i.test(c)).length;if(s>bs){bs=s;best=i}}return bs>=2?best:0}
function guessMap(hdr,kind){const used=new Set(),m={};const F=FIELDS[kind];
 const order=kind==='tb'?['sid','sia','sfd','sfa','n','c','si','ca','ab','sf']:['f','p','t','d','c','ca','ab','imp','dc'];
 order.forEach(k=>{const re=F.find(x=>x[0]===k)[2];const i=hdr.findIndex((h,ix)=>!used.has(ix)&&re.test(String(h).trim()));if(i>=0){m[k]=i;used.add(i)}});
 if(kind==='tb'&&m.sfd!=null&&m.sfa!=null)delete m.sf;if(kind==='tb'&&m.sid!=null&&m.sia!=null)delete m.si;return m}
function buildJR(data,m){const out=[];let lastAcc='',lastDate='',lastPol='',lastT='';const g=(r,k)=>m[k]!=null?r[m[k]]:undefined;
 data.forEach(r=>{const cRaw=String(g(r,'c')??'').trim();const fd=pdate(g(r,'f'));let ca=num(g(r,'ca')),ab=num(g(r,'ab'));
  if(m.imp!=null&&m.ca==null){const v=num(g(r,'imp'));const dc=String(g(r,'dc')??'').trim();if(dc){if(/^(c|cargo|d|debe|debit|dr|deudor)$/i.test(dc))ca=Math.abs(v);else ab=Math.abs(v)}else{if(v>=0)ca=v;else ab=-v}}
  const codeLike=/^\d[\d\-\.\s]{1,}$/.test(cRaw.split(/\s/)[0]||'');
  if(!fd&&!ca&&!ab){if(codeLike)lastAcc=cRaw.split(/\s+/)[0];return}
  if(/total|saldo/i.test(String(r.join(' ')).slice(0,40))&&!fd)return;
  let c=codeLike?cRaw.split(/\s+/)[0]:lastAcc;if(!c)return;if(!ca&&!ab)return;
  const f=fd||lastDate;lastDate=f;const p=String(g(r,'p')??'').trim()||lastPol;lastPol=p;const t=String(g(r,'t')??'').trim()||(m.t!=null?lastT:'');lastT=t;
  out.push([f,p,t,c,String(g(r,'d')??'').trim().slice(0,120),r2(ca),r2(ab)])});return out}
async function saveChunks(kind,rows){const isJ=kind==='jr';const size=isJ?900:1200;const col=engPath()+'/'+(isJ?'jr':'tb');const prefix=isJ?'j':kind;
 const existing=isJ?Object.keys(S.jrDocs):Object.entries(S.tbDocs).filter(([,d])=>d.kind===kind).map(([id])=>id);
 const n=Math.ceil(rows.length/size);for(let i=0;i<n;i++){const id=prefix+'-'+i;await S.db.doc(col+'/'+id).set(isJ?{idx:i,rows:rows.slice(i*size,(i+1)*size)}:{kind,idx:i,rows:rows.slice(i*size,(i+1)*size)})}
 for(const id of existing){const k=+id.split('-').pop();if(k>=n)await S.db.doc(col+'/'+id).delete()}}

function efLines(f){const C=calc();const raw=C.L[f]||{};const v={};LINES.forEach(l=>v[l.k]=Math.round(raw[l.k]||0));
 const ub=v.vn-v.cv,uo=ub-v.gv-v.ga-v.oig-v.ptuR,rif=-(v.ii+v.gi+v.cam+v.orif),uai=uo+rif,ni=uai-v.isrc-v.isrd;
 const start=f==='antSi';const ra=v.ra+(start?0:ni);
 const sum=g=>LINES.filter(l=>l.g===g).reduce((s,l)=>s+v[l.k],0);
 const ac=sum('ACT'),anc=sum('ANC'),act=ac+anc,pcp=sum('PCP'),plp=sum('PLP'),pas=pcp+plp;
 let raD=ra;const capPre=v.cs+v.rl+raD+v.ori;const rnd=act-pas-capPre;raD+=rnd;
 return {v,ub,uo,rif,uai,ni,ac,anc,act,pcp,plp,pas,cs:v.cs,rl:v.rl,ra:raD,ori:v.ori,cap:v.cs+v.rl+raD+v.ori,rnd}}

 const add=(t,a,b,cls)=>rows.push({t,v:[a,b],cls:cls||''});
 rows.push({t:'Activo',h:1});rows.push({t:'Activo circulante:',h:2});L_('ACT').forEach(l=>add(l.n,E.v[l.k],B.v[l.k]));add('Suma el activo circulante',E.ac,B.ac,'sub');
 L_('ANC').forEach(l=>add(l.n,E.v[l.k],B.v[l.k]));add('Total del activo',E.act,B.act,'tot');

 if(E.plp||B.plp){rows.push({t:'Pasivo a largo plazo:',h:2});L_('PLP').forEach(l=>add(l.n,E.v[l.k],B.v[l.k]));add('Suma el pasivo a largo plazo',E.plp,B.plp,'sub')}
 add('Total del pasivo',E.pas,B.pas,'sub');rows.push({t:'Capital contable:',h:2});
 add('Capital social',E.cs,B.cs);if(E.rl||B.rl)add('Reserva legal',E.rl,B.rl);add('Resultados acumulados',E.ra,B.ra);if(E.ori||B.ori)add('Otros resultados integrales',E.ori,B.ori);
 add('Total del capital contable',E.cap,B.cap,'sub');add('Total del pasivo y capital contable',E.pas+E.cap,B.pas+B.cap,'tot');
 return {key:'sfin',title:'Estados de situación financiera',period:`Al ${m.dm} de ${m.ej} y ${m.ant}`,cols:[String(m.ej),String(m.ant)],rows,checks:[['Activo = pasivo + capital',E.act-E.pas-E.cap,B.act-B.pas-B.cap]],note:Math.abs(E.rnd)+Math.abs(B.rnd)>0?`Redondeo aplicado en resultados acumulados: ${money0(E.rnd)} y ${money0(B.rnd)}.`:''}}

 ${S.adj.map(a=>{const e=adjEffect(a);const T=adjTotals(a);const tr=Math.abs(e.res)<M.am&&Math.abs(e.act)<M.am;const ls=a.lines||[];return ls.map((l,i)=>`<tr>${i===0?`<td rowspan="${ls.length+1}" class="ref">${adjRef(a)}</td><td rowspan="${ls.length+1}" style="max-width:260px">${esc(a.desc)}<div class="small muted">${esc(a.origen||'')}${tr?' · Menor al AMPT':''}</div></td><td rowspan="${ls.length+1}">${esc(({contable:'Contable',reclasificacion:'Reclasificación',fiscal:'Fiscal'})[a.tipo]||a.tipo)}</td><td rowspan="${ls.length+1}">${adjPill(a.estado)}</td>`:''}<td class="code">${esc(l.c)}</td><td class="small">${esc(C.accs[l.c]?C.accs[l.c].n:'Cuenta no encontrada')}</td><td class="n">${money(l.ca)}</td><td class="n">${money(l.ab)}</td>${i===0?`<td rowspan="${ls.length+1}" class="n">${money(e.res)}</td><td rowspan="${ls.length+1}"><button class="btn sm" data-act="adjEdit" data-id="${a.id}">Editar</button></td>`:''}</tr>`).join('')+`<tr class="sub"><td colspan="2" class="small">${T.ok?'Σ Cuadrado':'<span class="neg">No cuadra</span>'}</td><td class="n">${money(T.ca)}</td><td class="n">${money(T.ab)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Sin asientos de ajuste. Créalos desde aquí, desde una confirmación o desde una prueba con diferencia.</div>'}`}
function ajSud(C,M){const un=S.adj.filter(a=>a.estado==='no_ajustado'&&a.tipo!=='fiscal');const tot={act:0,pas:0,cap:0,res:0};const rows=un.map(a=>{const e=adjEffect(a);Object.keys(tot).forEach(k=>tot[k]+=e[k]);return {a,e}});
 const ant=+getp(S.eng,'mat.sudAnt')||0;const acc=tot.res+ant;const ratio=M.g?Math.abs(acc)/M.g:0;const big=Math.max(Math.abs(tot.act),Math.abs(tot.pas),Math.abs(tot.cap));
 const concl=ratio>=1||big>=M.g?['bad','Las diferencias no ajustadas son materiales, individualmente o en conjunto. Solicita a la administración que registre los ajustes; si no lo hace, evalúa una opinión con salvedades o adversa (NIA 705).']:ratio>=.5?['warn','Las diferencias no ajustadas se acercan a la materialidad. Evalúa factores cualitativos y el riesgo de errores no detectados.']:['','Las diferencias no ajustadas no son materiales en su conjunto.'];

 <div class="note ${concl[0]}">${concl[1]}</div>
 <div class="tw"><table><thead><tr><th>Ref.</th><th>Descripción</th><th class="n">Activo</th><th class="n">Pasivo</th><th class="n">Capital</th><th class="n">Resultados</th></tr></thead><tbody>${rows.map(({a,e})=>`<tr><td class="ref">${adjRef(a)}</td><td>${esc(a.desc)}</td><td class="n">${money(e.act)}</td><td class="n">${money(e.pas)}</td><td class="n">${money(e.cap)}</td><td class="n">${money(e.res)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Sin diferencias no ajustadas.</td></tr>'}
 <tr class="tot"><td></td><td>Total</td><td class="n">${money(tot.act)}</td><td class="n">${money(tot.pas)}</td><td class="n">${money(tot.cap)}</td><td class="n">${money(tot.res)}</td></tr></tbody></table></div>`}

 md.querySelector('#aj-l').addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r){lines.splice(+r.dataset.rm,1);draw()}});

  const tp=md.querySelector('#aj-t').value;const num=(a.num&&(a.tipo||'contable')===tp)?a.num:Math.max(0,...S.adj.filter(x=>(x.tipo||'contable')===tp&&x.id!==a.id).map(x=>x.num||0))+1;subSet('adj',a.id||'a'+rid(),{num,desc:md.querySelector('#aj-d').value,tipo:md.querySelector('#aj-t').value,estado:md.querySelector('#aj-e').value,origen:md.querySelector('#aj-o').value,fund:md.querySelector('#aj-fd').value,lines:lines.filter(l=>l.ca||l.ab),createdBy:a.createdBy||S.uid});md.remove()};

function fiscal(){const C=calc();const F=S.eng.fis||{};const T=C.T.aud;let nd=0,dep=0,pp=0,ptuReg=0;
 C.order.forEach(c=>{const a=C.accs[c];if(!a.hasAct)return;const g=RB[a.r]&&RB[a.r].g;if(a.nd&&g==='RES')nd+=a.aud;if(a.tag==='deprec')dep+=a.aud;if(a.tag==='pagProv')pp+=a.aud;if(a.tag==='ptu'&&g==='RES')ptuReg+=a.aud});
 const aai=calcAAI(C);const v=k=>+F[k]||0;
 const fadj=S.adj.filter(a=>a.tipo==='fiscal').reduce((s,a)=>s-adjEffect(a).res,0);
 const ptuImp=C.order.reduce((s,c)=>{const a=C.accs[c];return s+(a.tag==='ptu'&&RB[a.r]&&RB[a.r].sec==='IMP'?a.aud:0)},0);
 const L={uai:T.uai-ptuImp,aaiAcum:aai.res>0?aai.res:0,anticipos:v('anticipos'),otrosIngF:v('otrosIngF'),aaiDed:aai.res<0?-aai.res:0,otrosIngC:v('otrosIngC'),nd:nd,depC:dep,ptuReg:ptuReg,isrC:T.isr-ptuImp,otrosDedC:v('otrosDedC')+fadj,depF:v('depF'),ptuPag:v('ptuPag'),otrosDedF:v('otrosDedF')};
 L.rf=L.uai+L.ptuReg+L.aaiAcum+L.anticipos+L.otrosIngF-L.aaiDed-L.otrosIngC+L.nd+L.depC+L.otrosDedC-L.depF-L.ptuPag-L.otrosDedF;
 L.perd=Math.min(v('perdidas'),Math.max(L.rf,0));L.base=Math.max(L.rf-L.perd,0);L.isr=L.base*.3;L.pp=pp||v('pagProv');L.cargo=L.isr-L.pp;L.decl=v('isrDecl');L.ptuBase=(L.rf+L.ptuPag)*.1;return L}
function calcAAI(C){const F=S.eng.fis||{};const cr=(F.aaiCred||'B,C').split(',').map(s=>s.trim());const de=(F.aaiDeud||'AA,BB,DD').split(',').map(s=>s.trim());
 const bal=rs=>{const m=Array(12).fill(0);C.order.forEach(c=>{const a=C.accs[c];if(!rs.includes(a.r))return;let s=a.si;const mm=C.mon[c];for(let i=0;i<12;i++){if(mm)s+=mm.ca[i]-mm.ab[i];m[i]+=s*RB[a.r].s}});return m};
 const mc=bal(cr),md=bal(de);const pc_=mc.reduce((a,b)=>a+b,0)/12,pd=md.reduce((a,b)=>a+b,0)/12;const f=+F.factorAAI||0;const res=(pd-pc_)*f;return {mc,md,pc:pc_,pd,f,res,cr,de}}

 return `<div class="grid2"><section class="panel"><h2>Conciliación entre el resultado contable y el fiscal (ISR)</h2><div class="tw"><table><tbody>

 <tr><td colspan="2" class="small muted">Menos: ingresos contables no fiscales</td></tr>${row('Ajuste anual por inflación deducible',-L.aaiDed)}${row('Otros ingresos contables no fiscales',0,'',fin('otrosIngC'))}

function fIva(){const C=calc();const M=mat();const F=S.eng.fis||{};const iv=F.iva||{};
 const byTag=(tag,side)=>{const m=Array(12).fill(0);C.order.forEach(c=>{const a=C.accs[c];if(a.tag!==tag)return;const mm=C.mon[c];if(mm)for(let i=0;i<12;i++)m[i]+=side==='ab'?mm.ab[i]:mm.ca[i]});return m};
 const ing=Array(12).fill(0);C.order.forEach(c=>{const a=C.accs[c];if(a.r!=='10')return;const mm=C.mon[c];if(mm)for(let i=0;i<12;i++)ing[i]+=mm.ab[i]-mm.ca[i]});
 const sets=[['Ingresos contables vs CFDI emitidos y declarados',ing,[['cfdi','CFDI emitidos (subtotal)'],['ingDecl','Ingresos declarados']]],['IVA trasladado',byTag('ivaTras','ab'),[['trasDecl','Declarado']]],['IVA acreditable',byTag('ivaAcred','ca'),[['acredDecl','Declarado']]],['Retenciones de ISR por salarios',byTag('retIsrSal','ab'),[['retSalDecl','Enterado']]],['Retenciones de ISR honorarios y arrendamiento',byTag('retIsrHon','ab'),[['retHonDecl','Enterado']]],['IVA retenido',byTag('retIva','ab'),[['retIvaDecl','Enterado']]]];
 if(!C.jr.length)return '<div class="empty">Importa el diario: los importes contables mensuales se obtienen de los movimientos.</div>';

function wordDoc(title,body){return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#18233A}h1{font-family:Cambria,Georgia,serif;color:#1F3557;font-size:16pt}h2{font-family:Cambria,Georgia,serif;color:#1F3557;font-size:12.5pt;margin-top:16pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #9FB2A0;padding:4px 6px;font-size:9.5pt}th{background:#E3ECE1}.n{text-align:right}.firm{color:#7F9C7A;font-size:9pt;letter-spacing:1px;text-transform:uppercase}</style></head><body><div class="firm">${esc((S.settings&&S.settings.firma)||'Osiris Guadiana · Servicios Contables')}</div>${body}</body></html>`}
function docBuild(kind){const d=S.eng.datos||{};const ck=S.eng.cierre||{};const C=calc();const M=mat();const ej=d.ejercicio||'';const fc=d.cierre?new Date(d.cierre+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}):'31 de diciembre de '+ej;const nm=esc(d.nombre||'');let html='',fn='';
 if(kind==='opinion'){const op=ck.opinion||'limpia';const tit={limpia:'Opinión',salvedad:'Opinión con salvedades',adversa:'Opinión adversa',abstencion:'Abstención de opinión'}[op];
  const p1=op==='abstencion'?`Fuimos contratados para auditar los estados financieros de ${nm} (la Entidad), que comprenden el estado de situación financiera al ${fc}, el estado de resultado integral, el estado de cambios en el capital contable y el estado de flujos de efectivo correspondientes al ejercicio terminado en esa fecha, así como las notas explicativas. No expresamos una opinión sobre los estados financieros adjuntos. Debido a la importancia de lo descrito en la sección Fundamento de la abstención de opinión, no hemos podido obtener evidencia de auditoría que proporcione una base suficiente y adecuada para expresar una opinión.`
  :`Hemos auditado los estados financieros de ${nm} (la Entidad), que comprenden el estado de situación financiera al ${fc}, el estado de resultado integral, el estado de cambios en el capital contable y el estado de flujos de efectivo correspondientes al ejercicio terminado en esa fecha, así como las notas explicativas que incluyen un resumen de las políticas contables significativas. ${op==='adversa'?`En nuestra opinión, debido a la importancia de lo descrito en la sección Fundamento de la opinión adversa, los estados financieros adjuntos no presentan razonablemente la situación financiera de la Entidad al ${fc}, ni sus resultados y flujos de efectivo, de conformidad con las ${esc(d.marco||'NIF mexicanas')}.`:`En nuestra opinión, ${op==='salvedad'?'excepto por los efectos del asunto descrito en la sección Fundamento de la opinión con salvedades, ':''}los estados financieros adjuntos presentan razonablemente, en todos los aspectos materiales, la situación financiera de la Entidad al ${fc}, así como sus resultados y flujos de efectivo correspondientes al ejercicio terminado en esa fecha, de conformidad con las ${esc(d.marco||'Normas de Información Financiera mexicanas')}.`}`;
  html=`<h1>Informe de los auditores independientes</h1><p>A la Asamblea de Accionistas de ${nm}</p><h2>${tit}</h2><p>${p1}</p><h2>Fundamento de la ${tit.toLowerCase()}</h2>${op!=='limpia'?`<p>${esc(ck.fundamento||'[Describir el asunto que origina la modificación y cuantificar sus efectos.]')}</p>`:''}<p>Hemos llevado a cabo nuestra auditoría de conformidad con las Normas Internacionales de Auditoría (NIA). Nuestras responsabilidades se describen más adelante. Somos independientes de la Entidad de conformidad con el Código de Ética Profesional del Instituto Mexicano de Contadores Públicos y hemos cumplido las demás responsabilidades de ética de conformidad con dicho Código. ${op==='abstencion'?'':'Consideramos que la evidencia de auditoría obtenida proporciona una base suficiente y adecuada para nuestra opinión.'}</p>${ck.enfasis?`<h2>Párrafo de énfasis</h2><p>${esc(ck.enfasis)}</p>`:''}<h2>Responsabilidades de la administración y de los responsables del gobierno de la Entidad</h2><p>La administración es responsable de la preparación y presentación razonable de los estados financieros de conformidad con el marco de información aplicable y del control interno que considere necesario para permitir su preparación libre de incorrección material, debida a fraude o error. Al preparar los estados financieros, la administración es responsable de evaluar la capacidad de la Entidad para continuar como negocio en marcha. Los responsables del gobierno supervisan el proceso de información financiera.</p><h2>Responsabilidades del auditor</h2><p>Nuestros objetivos son obtener una seguridad razonable de que los estados financieros en su conjunto están libres de incorrección material, debida a fraude o error, y emitir un informe que contenga nuestra opinión. Seguridad razonable es un alto grado de seguridad, pero no garantiza que una auditoría realizada de conformidad con las NIA siempre detecte una incorrección material cuando existe. Como parte de la auditoría, aplicamos nuestro juicio profesional y mantenemos escepticismo profesional; identificamos y valoramos los riesgos de incorrección material, diseñamos y aplicamos procedimientos para responder a dichos riesgos, obtenemos conocimiento del control interno relevante, evaluamos las políticas contables y las estimaciones, concluimos sobre el uso de la base de negocio en marcha y evaluamos la presentación global de los estados financieros. Comunicamos a los responsables del gobierno el alcance y el momento de la auditoría y los hallazgos significativos, incluidas las deficiencias significativas del control interno identificadas.</p><p><br>${esc((S.settings&&S.settings.firma)||'Osiris Guadiana · Servicios Contables')}<br><br><br>${esc(d.socio||'C.P.C. [Nombre del socio]')}<br>Socio</p><p>${esc(ck.lugar||'[Ciudad], a [fecha]')}</p>`;fn='Opinion_'+ej+'.doc'}
 else if(kind==='repr'){html=`<p>${esc(ck.lugar||'[Ciudad y fecha]')}</p><p>${esc((S.settings&&S.settings.firma)||'Osiris Guadiana · Servicios Contables')}<br>Presente</p><h1>Carta de representación</h1><p>Esta carta se proporciona en relación con su auditoría de los estados financieros de ${nm} al ${fc}, con el propósito de expresar una opinión sobre si presentan razonablemente, en todos los aspectos materiales, la situación financiera de la Entidad de conformidad con las ${esc(d.marco||'NIF mexicanas')}. Confirmamos, a nuestro leal saber y entender, lo siguiente:</p><ol><li>Hemos cumplido nuestra responsabilidad de preparar los estados financieros de conformidad con el marco de información aplicable.</li><li>Les hemos proporcionado acceso a toda la información relevante, a los registros contables, actas de asamblea y documentación soporte, y acceso sin restricción a las personas de la Entidad.</li><li>Todas las transacciones han sido registradas en los registros contables y se reflejan en los estados financieros.</li><li>Los supuestos significativos utilizados en las estimaciones contables son razonables.</li><li>Las relaciones y transacciones con partes relacionadas han sido reveladas y registradas adecuadamente.</li><li>Todos los hechos posteriores a la fecha de los estados financieros que requieren ajuste o revelación han sido ajustados o revelados.</li><li>Les hemos revelado los resultados de nuestra evaluación del riesgo de fraude y no tenemos conocimiento de fraude o indicios de fraude que afecten a la Entidad.</li><li>Les hemos revelado todos los litigios, reclamaciones y contingencias conocidos.</li><li>Hemos cumplido con las disposiciones fiscales aplicables y no existen contingencias fiscales distintas de las reveladas.</li><li>Los efectos de las incorrecciones no corregidas, resumidas en el anexo, son inmateriales, individualmente y en conjunto, para los estados financieros en su conjunto.</li></ol><h2>Anexo · Diferencias no corregidas</h2>${sudTable(C)}<p><br><br>______________________________<br>Director General</p><p><br>______________________________<br>Director de Finanzas</p>`;fn='Carta_representacion_'+ej+'.doc'}
 else if(kind==='obs'){html=`<p>${esc(ck.lugar||'[Ciudad y fecha]')}</p><p>A la Administración y a los responsables del gobierno de ${nm}</p><h1>Carta de observaciones y recomendaciones</h1><p>Como parte de nuestra auditoría de los estados financieros al ${fc}, consideramos el control interno relevante para la preparación de los estados financieros con el fin de diseñar procedimientos de auditoría adecuados, y no con la finalidad de expresar una opinión sobre su eficacia. A continuación comunicamos las deficiencias y asuntos que identificamos, junto con nuestras recomendaciones.</p>${S.obs.length?S.obs.map(o=>`<h2>OB-${o.num}. ${esc(o.titulo)} <span style="font-size:9pt;color:#7F9C7A">(${esc(o.tipo)} · nivel ${esc(o.nivel)})</span></h2><p><b>Condición.</b> ${esc(o.condicion)}</p><p><b>Criterio.</b> ${esc(o.criterio)}</p>${o.fund?`<p><b>Fundamento.</b> ${esc(o.fund)}</p>`:''}<p><b>Causa.</b> ${esc(o.causa)}</p><p><b>Efecto.</b> ${esc(o.efecto)}</p><p><b>Recomendación.</b> ${esc(o.recomendacion)}</p><p><b>Comentario de la administración.</b> ${esc(o.respuesta||'Pendiente.')}</p>`).join(''):'<p>No se identificaron observaciones.</p>'}<p><br>Atentamente,<br>${esc(d.socio||'[Socio]')}</p>`;fn='Carta_observaciones_'+ej+'.doc'}
 else {html=`<h1>Resumen de diferencias de auditoría</h1><p>${nm} · Ejercicio ${esc(ej)}</p><p>Materialidad global ${money(M.g)} · Materialidad de ejecución ${money(M.ej)} · AMPT ${money(M.am)}</p><h2>Ajustes propuestos y aceptados</h2>${adjTable(C,S.adj.filter(a=>a.estado!=='no_ajustado'))}<h2>Diferencias no ajustadas</h2>${sudTable(C)}`;fn='Resumen_diferencias_'+ej+'.doc'}
 html+=docFundHtml(kind==='opinion'||kind==='repr'||kind==='obs'?kind:'sud');return {html,fn}}

function sudTable(C){const un=S.adj.filter(a=>a.estado==='no_ajustado'&&a.tipo!=='fiscal');const t={act:0,pas:0,cap:0,res:0};return `<table><tr><th>Ref.</th><th>Descripción</th><th>Activo</th><th>Pasivo</th><th>Capital</th><th>Resultados</th></tr>${un.map(a=>{const e=adjEffect(a);Object.keys(t).forEach(k=>t[k]+=e[k]);return `<tr><td>${adjRef(a)}</td><td>${esc(a.desc)}</td><td class="n">${money(e.act)}</td><td class="n">${money(e.pas)}</td><td class="n">${money(e.cap)}</td><td class="n">${money(e.res)}</td></tr>`}).join('')||'<tr><td colspan="6">Sin diferencias no ajustadas.</td></tr>'}<tr><th></th><th>Total</th><th class="n">${money(t.act)}</th><th class="n">${money(t.pas)}</th><th class="n">${money(t.cap)}</th><th class="n">${money(t.res)}</th></tr></table>`}
function adjTable(C,list){return `<table><tr><th>Ref.</th><th>Descripción</th><th>Cuenta</th><th>Nombre</th><th>Cargo</th><th>Abono</th></tr>${list.map(a=>(a.lines||[]).map((l,i)=>`<tr><td>${i?'':adjRef(a)}</td><td>${i?'':esc(a.desc)+(a.fund?'<br><small>Fundamento: '+esc(a.fund)+'</small>':'')}</td><td>${esc(l.c)}</td><td>${esc(C.accs[l.c]?C.accs[l.c].n:'')}</td><td class="n">${money(l.ca)}</td><td class="n">${money(l.ab)}</td></tr>`).join('')).join('')||'<tr><td colspan="6">Sin ajustes.</td></tr>'}</table>`}
function xlsx(sheets,name){if(!window.XLSX){toast('No se cargó el generador de Excel. Recarga la página.');return}const wb=XLSX.utils.book_new();sheets.forEach(([n,rows])=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0]?rows[0].map((_,i)=>({wch:i<2?14:i===2?42:16})):[];XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))});save(name,XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
function xlsHead(t){const d=S.eng.datos||{};const m=efMeta();return [[d.nombre||''],[`Auditoría al ${m.dm} de ${m.ej}`],[t],['(En pesos)'],[]]}
function wpSheet(k,C){const R=C.rub[k];const s=RB[k].s;const w=S.wp[k]||{};const p=showPre();const d=S.eng.datos||{};
 const hdr=['No. de cuenta','Nombre de la cuenta','Referencia'].concat(p?['Saldo al corte preliminar']:[],['Saldo al cierre','Ajustes','Saldo ajustado','Reclasificaciones','Saldo auditado','Saldo año anterior','Variación','%','Marcas']);
 const line=(a,ref)=>[a.c||'',a.n||'',ref].concat(p?[r2(a.pre*s)]:[],[r2(a.sf*s),r2((a.ajc-a.aja)*s),r2(a.adjd*s),r2((a.rcc-a.rca)*s),r2(a.aud*s),r2(a.ant*s),r2((a.aud-a.ant)*s),a.ant?r2((a.aud-a.ant)/Math.abs(a.ant)):'']);
 const rows=xlsHead(`Sumaria de ${RB[k].n}`).concat([hdr]);
 R.accs.forEach((a,i)=>rows.push(line(a,k+'-'+(i+1)).concat([((w.marks||{})['acc:'+a.c]||[]).join(' ')])));
 rows.push(line({c:'',n:'Total '+RB[k].n,...R},k).concat([((w.marks||{}).tot||[]).join(' ')]));
 rows.push([],['Procedimientos'],['Aseveración','Tipo','Procedimiento','Hecho','Ref.','Resultado']);
 live(w.procs).sort((a,b)=>(a[1].ord||0)-(b[1].ord||0)).forEach(([,q])=>rows.push([q.asev,q.tipo==='X'?'Fiscal':'Financiero',q.txt,q.done?'Sí':'No',q.ref||'',q.res||'']));
 const tests=live(w.tests);if(tests.length){rows.push([],['Pruebas de detalle'],['Cuenta','Fecha','Póliza','Concepto','Importe','Proveedor','Factura','Fecha factura','Pago','Fecha pago','Pedimento','Moneda','M.E.','T.C.','Subtotal soporte','IVA','Ret. IVA','Diferencia','Procedimientos','Comentario']);
  tests.forEach(([key,t])=>{const j=C.jr.find(x=>'jr:'+x.k===key);rows.push([j?j.c:'',j?j.f:'',j?((j.t?j.t+' ':'')+j.p):'',j?j.d:'',t.imp,t.prov||'',t.fact||t.uuid||'',t.ffact||'',t.pago||'',t.fpago||'',t.ped||'',t.mon||'',t.me||'',t.tc||'',t.sop,t.iva||'',t.riva||'',t.dif||0,t.pl||'',t.com||''])});
  rows.push(['Procedimientos: '+procLeg().map(q=>q[0]+' '+q[1]).join('; ')])}
 rows.push([],['Conclusión',w.concl||''],['Elaboró',w.prep?(S.names[w.prep.by]||'')+' '+fdate(w.prep.at):''],['Revisó',w.rev?(S.names[w.rev.by]||'')+' '+fdate(w.rev.at):''],['Autorizó',w.aut?(S.names[w.aut.by]||'')+' '+fdate(w.aut.at):'']);return rows}
function espSheets(k,C){const w=S.wp[k]||{};const x={C,k,w,M:mat(),tc:S.eng.tc||{},esp:w.esp||{}};return espList(k).map(t=>{const sh=tplSheet(t,x);return sh&&sh.length>3?[k+' '+TPL[t].t,xlsHead(TPL[t].t).concat(sh.slice(1))]:null}).filter(Boolean)}
ACT.xlsWp=()=>{const C=calc();xlsx([[S.rubro,wpSheet(S.rubro,C)]].concat(espSheets(S.rubro,C)),`Cedula_${S.rubro}_${(S.eng.datos||{}).ejercicio||''}.xlsx`)};
ACT.xlsAll=()=>{const C=calc(),M=mat();
 const pl=xlsHead('Planeación y materialidad').concat([['Método',M.metodo==='escala'?'Escala declinante sobre ingresos en dólares':'Porcentaje sobre '+M.bases[M.b][0]],['Base en pesos',r2(M.base)],M.metodo==='escala'?['Tipo de cambio',M.tcu]:[],M.metodo==='escala'?['Ingresos en dólares',r2(M.usd)]:[],['Factor o porcentaje',M.p],['Materialidad',r2(M.g)],['Precisión monetaria',r2(M.ej)],['Cifras erróneas estimadas',r2(M.cee)],['AMPT',r2(M.am)],[],['Ref.','Sumaria','Riesgo inherente','Riesgo de control','Fraude','RIM','Alcance','R']]);
 RUB.forEach(r=>{if(!C.rub[r.k].accs.length)return;const k=riskOf(r.k);pl.push([r.k,r.n,LVLN[LVL[k.ri]],LVLN[LVL[k.rc]],k.fr?'Sí':'No',LVLN[k.lvl],k.enf.alc,k.enf.R])});
 const adjS=(tipo,t)=>{const o=xlsHead(t).concat([['No. cuenta','Nombre de la cuenta','Cargo','Abono','Estado']]);S.adj.filter(a=>(a.tipo||'contable')===tipo).forEach(a=>{o.push([],['.===- '+adjRef(a)+' ===.']);(a.lines||[]).forEach(l=>o.push([l.c,C.accs[l.c]?C.accs[l.c].n:'',+l.ca||0,+l.ab||0,a.estado]));const T=adjTotals(a);o.push(['','',T.ca,T.ab],[a.desc])});return o};
 const ob=xlsHead('Cédula de observaciones').concat([['Ref.','Título','Tipo','Sumaria','Nivel','Condición','Criterio','Causa','Efecto','Recomendación','Respuesta','Estado']]);S.obs.forEach(o=>ob.push(['OB-'+o.num,o.titulo,o.tipo,o.rubro,o.nivel,o.condicion,o.criterio,o.causa,o.efecto,o.recomendacion,o.respuesta,o.estado]));
 const L=fiscal();const fi=xlsHead('Conciliación contable-fiscal').concat([['Utilidad contable antes de impuestos',r2(L.uai)],['AAI acumulable',r2(L.aaiAcum)],['AAI deducible',r2(L.aaiDed)],['No deducibles',r2(L.nd)],['Depreciación contable',r2(L.depC)],['Deducción fiscal de inversiones',r2(L.depF)],['PTU pagada',r2(L.ptuPag)],['Resultado fiscal',r2(L.rf)],['Base gravable',r2(L.base)],['ISR 30%',r2(L.isr)],['Pagos provisionales',r2(L.pp)],['ISR a cargo',r2(L.cargo)],['ISR declarado',r2(L.decl)]]);
 const cf=xlsHead('Control de confirmaciones').concat([['Tipo','Tercero','Cuenta','Saldo libros','Enviada','Recibida','Saldo confirmado','Alterno']]);S.conf.forEach(c=>cf.push([c.tipo,c.tercero,c.cuenta,c.saldoLibros,c.enviada,c.recibida,c.saldoConf,c.alterno]));
 const sheets=[['1.17 Materialidad',pl],...ciSheets(),['BZA marcada',bzSheet(C)],['1 Situación financiera',stSheet(stBal())],['2 Resultados',stSheet(stRes())],['3 Cambios en el capital',stSheet(stCap())],['4 Flujos de efectivo',stSheet(stFlu())]];
 RUB.forEach(r=>{if(C.rub[r.k].accs.length||S.wp[r.k]){sheets.push([r.k,wpSheet(r.k,C)]);espSheets(r.k,C).forEach(s=>sheets.push(s))}});
 extraSheets().forEach(x=>sheets.push(x));sheets.push(["AJA's",adjS('contable','Cédula resumen de ajustes')],["RECLA's",adjS('reclasificacion','Cédula resumen de reclasificaciones')],["AJF's",adjS('fiscal','Ajustes fiscales')],['Observaciones',ob],['Fiscal',fi],['Confirmaciones',cf]);
 const used=new Set();sheets.forEach(s=>{let n=s[0].replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31);let i=2;while(used.has(n.toLowerCase())){n=n.slice(0,28)+' '+i++}used.add(n.toLowerCase());s[0]=n});
 xlsx(sheets,`Expediente_${((S.eng.datos||{}).nombre||'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').slice(0,30)}_${(S.eng.datos||{}).ejercicio||''}.xlsx`)};

/* ================= Configuración ================= */
function vCfg(){const ms=marksCat();
 return header('Marcas y configuración','Catálogo de marcas de auditoría y datos del despacho, compartidos por todos los expedientes.')+
 `<section class="panel"><h2>Despacho</h2><div class="form"><label class="f">Nombre que aparece en los documentos<input id="cf-firma" value="${esc((S.settings&&S.settings.firma)||'Osiris Guadiana · Servicios Contables')}" ${S.canEdit?'':'disabled'}></label></div></section>
 <section class="panel"><header><h2>Catálogo de marcas</h2>${S.canEdit?'':'<span class="pill">Solo editores pueden modificarlo</span>'}</header><div class="tw"><table><thead><tr><th>Marca</th><th>Significado</th><th></th></tr></thead><tbody id="mk-b">${ms.map((m,i)=>`<tr><td><input value="${esc(m[0])}" data-i="${i}" data-f="0" style="width:60px;color:var(--bad);font-weight:600" ${S.canEdit?'':'disabled'} aria-label="Símbolo"></td><td><input value="${esc(m[1])}" data-i="${i}" data-f="1" ${S.canEdit?'':'disabled'} aria-label="Significado"></td><td>${S.canEdit?`<button class="btn sm dng" data-act="mkDel" data-i="${i}" aria-label="Quitar marca">✕</button>`:''}</td></tr>`).join('')}</tbody></table></div>
 ${S.canEdit?'<div class="row"><button class="btn sm" data-act="mkAdd">Agregar marca</button></div>':''}</section>
 ${temaPanel()}${fundRubPanel()}${tarifPanel()}${ciCatPanel()}
 <section class="panel"><header><h2>Leyenda de procedimientos</h2><span class="hint">Letras que se marcan en las pruebas de detalle y en las altas de activo fijo.</span></header><div class="tw"><table><thead><tr><th>Letra</th><th>Procedimiento</th></tr></thead><tbody id="pl-b">${procLeg().map((m,i)=>`<tr><td><input value="${esc(m[0])}" data-f="0" style="width:60px;font-weight:600" maxlength="2" ${S.canEdit?'':'disabled'} aria-label="Letra"></td><td><input value="${esc(m[1])}" data-f="1" ${S.canEdit?'':'disabled'} aria-label="Procedimiento"></td></tr>`).join('')}</tbody></table></div>
 ${S.canEdit?'<div class="row"><button class="btn sm" data-act="plAdd">Agregar procedimiento</button><button class="btn pri sm" data-act="cfgSave">Guardar configuración</button></div>':''}</section>`}
const readPl=()=>[...document.querySelectorAll('#pl-b tr')].map(r=>[r.querySelector('[data-f="0"]').value.trim().toUpperCase(),r.querySelector('[data-f="1"]').value]).filter(x=>x[0]);
ACT.plAdd=()=>{const m=readPl();const nx=String.fromCharCode(65+m.length);m.push([nx,'Nuevo procedimiento']);S.settings={...(S.settings||{}),marks:readMk(),procLeg:m};render()};
let mkDraft=null;const readMk=()=>{const rows=[...document.querySelectorAll('#mk-b tr')];return rows.map(r=>[r.querySelector('[data-f="0"]').value,r.querySelector('[data-f="1"]').value])};
ACT.mkAdd=()=>{const m=readMk();m.push(['?','Nueva marca']);S.settings={...(S.settings||{}),marks:m,procLeg:readPl()};render()};
ACT.mkDel=b=>{const m=readMk();m.splice(+b.dataset.i,1);S.settings={...(S.settings||{}),marks:m};render()};
ACT.cfgSave=async()=>{try{await S.db.doc('settings/firm').set({marks:readMk().filter(x=>x[0]),procLeg:readPl(),firma:$('#cf-firma').value,...stamp()});toast('Configuración guardada.')}catch(e){toast('Solo los editores pueden guardar la configuración.')}};

renderNav();window.__boot=boot;if(window.__ready)boot();
</script>
